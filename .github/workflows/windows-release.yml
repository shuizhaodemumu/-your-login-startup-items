name: Publish Linglong Guard Windows release

on:
  push:
    branches: [main]
    paths:
      - windows/releases/1.0.0/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linglong-windows-1.0.0-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify tested binary and prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          (cd windows/releases/1.0.0 && sha256sum -c SHA256SUMS.txt)
          mkdir -p release-assets
          cp windows/releases/1.0.0/LinglongGuard-1.0.0-windows-x64.zip release-assets/
          git archive --format=zip --prefix=LinglongGuard-1.0.0-source/ HEAD \
            windows/src windows/ui windows/tests windows/assets windows/docs \
            windows/Cargo.toml windows/Cargo.lock windows/build.ps1 windows/.gitignore \
            windows/README.md windows/VALIDATION.md windows/RELEASE_NOTES_1.0.0.md LICENSE \
            > release-assets/LinglongGuard-1.0.0-source.zip
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.0.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'The Windows 1.0.0 release already exists; leaving its assets unchanged.'
            exit 0
          fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title '玲珑守护 1.0.0 · Windows x64' \
            --notes-file windows/RELEASE_NOTES_1.0.0.md \
            --latest=false
